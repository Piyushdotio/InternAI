services:
  # -------------------------------------------------------------
  # 1. Express Node.js Backend Service
  # -------------------------------------------------------------
  - type: web
    name: ai-interviewer-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false

  # -------------------------------------------------------------
  # 2. Next.js Frontend Web Service
  # -------------------------------------------------------------
  - type: web
    name: ai-interviewer-frontend
    env: node
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
